[package]
name = "chitra"
description = "A local code-knowledge-graph engine that serves token-efficient, change-aware review context to AI assistants."
readme = "README.md"
keywords = ["code-review", "graph", "tree-sitter", "mcp", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "chitra"
path = "src/main.rs"

[features]
default = []
deep-resolve = ["chitra-core/deep-resolve"]
embeddings = ["chitra-core/embeddings"]
dynamic-grammars = ["chitra-core/dynamic-grammars"]

[dependencies]
chitra-core = { path = "crates/chitra-core" }
chitra-mcp = { path = "crates/chitra-mcp" }
anyhow.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/svssdeva/chitra"
rust-version = "1.97"

# tree-sitter core pinned once; every grammar crate resolves against it (ABI discipline, ADR-0001).
[workspace.dependencies]
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
streaming-iterator = "0.1"
anyhow = "1"
blake3 = "1"
rayon = "1"
serde_json = "1"
tiktoken-rs = "0.6"
toml = "0.8"
ignore = "0.4"
toml_edit = "0.22"
tree-sitter-language = "0.1"
libloading = "0.8"

[workspace.lints.rust]
unused_must_use = "deny"
